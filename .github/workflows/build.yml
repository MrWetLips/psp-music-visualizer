- name: Build
        run: |
          export PSPDEV=/usr/local/pspdev
          export PATH=$PATH:$PSPDEV/bin
          make
          echo "=== All imports ==="
          psp-nm retroviz.elf | grep -i "U " || true
          echo "=== Sections ==="
          psp-objdump -h retroviz.elf | head -50 || true
          ls -la EBOOT.PBP
